[project]
name = "ha-trading-helper"
version = "0.1.0"
description = "Explainable OKX spot 4h crypto signals published to Home Assistant over MQTT. Alerts only: it never places orders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Juan Manera" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "apscheduler>=3.10,<4",
    "aiomqtt>=2.3",
    "typer>=0.12",
    "structlog>=24.4",
    "matplotlib>=3.9",
]

[project.scripts]
ha-trading-helper = "ha_trading_helper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "respx>=0.21",
    "testcontainers>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_trading_helper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "PL", "RUF"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (Mosquitto container)"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:The wait_for_logs function:DeprecationWarning"]

[tool.coverage.run]
source = ["ha_trading_helper"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
