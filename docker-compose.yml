# Local stack: Mosquitto + Home Assistant + the app, no Supervisor needed.
# First run: open http://localhost:8123, finish onboarding and add the MQTT
# integration with broker "mosquitto" (HA no longer accepts it from YAML).
# The "Señales cripto" dashboard is loaded from dashboards/ in YAML mode.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ha-config:/config
      - ./deploy/ha-config/configuration.yaml:/config/configuration.yaml:ro
      - ./dashboards:/config/dashboards:ro
    ports:
      - "8123:8123"
    depends_on: [mosquitto]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: trading_helper/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HTH_MQTT_HOST: mosquitto
      HTH_DATA_DIR: /data
    volumes:
      - ./.data:/data
    depends_on: [mosquitto]
    restart: unless-stopped

  # Bitácora OKX on http://localhost:8099 (set HTH_OKX_* and HTH_OKX_DOMAIN in .env).
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: okx_journal
      MARIADB_USER: okx_journal
      MARIADB_PASSWORD: okx_journal  # local development only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped

  journal:
    build:
      context: .
      dockerfile: okx_journal/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HTH_MQTT_HOST: mosquitto
      HTH_DATA_DIR: /data
      HTH_DB_HOST: mariadb
      HTH_DB_USER: okx_journal
      HTH_DB_PASSWORD: okx_journal
    ports:
      - "8099:8099"
    volumes:
      - ./.data:/data
    depends_on: [mosquitto, mariadb]
    restart: unless-stopped

volumes:
  ha-config:
  mariadb:
