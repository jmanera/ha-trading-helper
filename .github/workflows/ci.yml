name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly backtest, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: make lint
      - name: Types
        run: make typecheck
      - name: Tests (unit, property, integration with Mosquitto)
        run: |
          uv run pytest -m "" --cov --cov-report=term --cov-report=xml
          uv run coverage report --include='*/indicators/*,*/strategy/*' --fail-under=100
      - name: Security
        run: make security
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        app: [trading_helper, intraday_monitor, okx_journal, crypto_fundamentals]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wear:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
      - name: Validate watch faces against the official Watch Face Format schema
        run: |
          curl -fsSL -o /tmp/wff-xsd.zip https://github.com/google/watchface/releases/download/release/wff-xsd.zip
          mkdir -p /tmp/wff-xsd && unzip -q /tmp/wff-xsd.zip -d /tmp/wff-xsd
          uv run --no-project --with xmlschema python wear/tools/validate_wff.py /tmp/wff-xsd
      - name: Build the Wear OS apps (the runner image ships the Android SDK)
        working-directory: wear
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wear-apks
          path: wear/*/build/outputs/apk/release/*.apk

  weekly-backtest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      # The validation downloads every candidate pair (the historical universe):
      # keep the candles between runs so only new ones are fetched. A cache entry
      # is immutable, so each run saves a new one and restores the latest.
      - uses: actions/cache@v4
        with:
          path: .data/candles
          key: candles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: candles-${{ runner.os }}-
      - name: Walk-forward validation on live OKX data
        env:
          HTH_DATA_DIR: .data
        run: uv run ha-trading-helper validate --years 2 | tee validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest
          path: |
            validation.txt
            .data/validation-*.json
