name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly backtest, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: make lint
      - name: Types
        run: make typecheck
      - name: Tests (unit, property, integration with Mosquitto)
        run: |
          uv run pytest -m "" --cov --cov-report=term --cov-report=xml
          uv run coverage report --include='*/indicators/*,*/strategy/*' --fail-under=100
      - name: Security
        run: make security
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trading_helper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  weekly-backtest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Walk-forward validation on live OKX data
        env:
          HTH_DATA_DIR: .data
        run: uv run ha-trading-helper validate --years 2 | tee validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest
          path: |
            validation.txt
            .data/validation-*.json
