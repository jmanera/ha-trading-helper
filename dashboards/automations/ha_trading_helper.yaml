# Example: notify when any pair changes to ENTRAR or SALIR.
# Replace notify.notify with your phone, e.g. notify.mobile_app_<device>.
# Run it by hand (Run actions) to get the current best opportunity as a test message.
- id: ha_trading_helper_cambio_senal
  alias: "Señales cripto: aviso de ENTRAR / SALIR"
  mode: queued
  triggers:
    - trigger: event
      event_type: state_changed
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.event.data.entity_id is match('sensor\.ha_trading_helper_.*_puntuacion$')
           and trigger.event.data.new_state is not none
           and trigger.event.data.new_state.attributes.accion in ['ENTRAR', 'SALIR']
           and (trigger.event.data.old_state is none
                or trigger.event.data.old_state.attributes.accion
                   != trigger.event.data.new_state.attributes.accion) }}
  actions:
    # Run by hand there is no event: send the best opportunity as a test.
    - variables:
        prueba: "{{ trigger.event is not defined }}"
        a: >-
          {{ states.sensor.ha_trading_helper_mejor_oportunidad.attributes if prueba
             else trigger.event.data.new_state.attributes }}
    - action: notify.notify
      data:
        title: "{{ '[Prueba] ' if prueba }}{{ a.par }}: {{ a.accion }} ({{ a.puntuacion }}/100)"
        message: >-
          {% if a.accion == 'SALIR' %}{{ a.salida }}{% else %}
          {%- for m in (a.motivos | selectattr('p', 'gt', 0) | sort(attribute='p', reverse=true))[:3] -%}
          +{{ m.p }} {{ m.e }}: {{ m.d }}{{ '\n' }}
          {%- endfor -%}
          {{ a.resumen_niveles | default('') }}{% endif %}
          {{ '' if a.alerta else '\n(informativa: estrategia sin validar)' }}
