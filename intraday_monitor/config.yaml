name: Monitor intradía
version: "0.1.0"
slug: intraday_monitor
description: Alertas de OKX en velas de 5 y 15 min y medición en papel de reglas intradía fijas. No opera.
url: https://github.com/jmanera/ha-trading-helper
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - mqtt:need
options:
  quote_currency: USDT
  max_pairs: 20
  min_volume_24h_usdt: 5000000
  volume_spike: 3.0
  move_atr: 2.0
  breakout_alerts: true
  btc_alerts: true
  cooldown_minutes: 60
  log_level: INFO
schema:
  quote_currency: list(USDC|USDT|EUR)
  max_pairs: int(1,50)
  min_volume_24h_usdt: float(0,)
  volume_spike: float(1,20)
  move_atr: float(0.5,10)
  breakout_alerts: bool
  btc_alerts: bool
  cooldown_minutes: int(5,1440)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?  # pragma: allowlist secret
