configuration:
  coingecko_api_key:
    name: CoinGecko Demo key
    description: Free at coingecko.com/en/api/pricing (Demo plan). Without it CoinGecko allows only a few calls a minute and analyses are slow or fail.
  github_token:
    name: GitHub token
    description: A token with no scopes (github.com/settings/tokens). Without it GitHub allows 60 calls an hour and the development score may have no data.
  refresh_minutes:
    name: Refresh the list every (minutes)
    description: How often the 4h change and volume of every pair are read from OKX.
  cache_hours:
    name: Reuse an analysis for (hours)
    description: Fundamentals change slowly. You can force a fresh read from each coin's page.
  coin_ids:
    name: CoinGecko coins
    description: Only when a symbol points to the wrong coin. Format SYMBOL=coingecko-id, e.g. TON=the-open-network.
  timezone:
    name: Time zone
    description: For showing dates and times.
  log_level:
    name: Log level
