configuration:
  quote_currency:
    name: Moneda de cotización
    description: Moneda contra la que se analizan los pares (p. ej. SOL-USDC). BTC en esta moneda es la referencia de mercado.
  bar:
    name: Temporalidad de vela
    description: Duración de cada vela. Se analiza al cierre de cada una (en UTC) y la validación se calcula aparte para cada temporalidad.
  pairs:
    name: Pares
    description: Lista fija de pares (p. ej. BTC-USDC). Vacío = los más líquidos de OKX en la moneda de cotización.
  max_pairs:
    name: Máximo de pares
    description: Tamaño del universo automático.
  min_volume_24h_usdt:
    name: Volumen mínimo 24 h (USD equivalentes)
    description: Filtro de liquidez del universo automático.
  enter_threshold:
    name: Umbral de entrada
    description: Puntuación mínima (0-100) para ENTRAR.
  wait_threshold:
    name: Umbral de vigilancia
    description: Por encima de esta puntuación una moneda en ESPERAR se marca para vigilar.
  require_validation:
    name: Exigir validación
    description: ENTRAR solo cuenta como alerta si la estrategia fue rentable fuera de muestra tras costes.
  capital:
    name: Capital simulado
    description: Capital para calcular el tamaño de posición sugerido.
  risk_per_trade_pct:
    name: Riesgo por operación (%)
  max_positions:
    name: Posiciones simultáneas
  fee_pct:
    name: Comisión (%)
    description: Comisión por lado. Compruébala en la página de comisiones de OKX.
  slippage_pct:
    name: Deslizamiento (%)
  positions:
    name: Posiciones abiertas
    description: Para avisar de SALIR. entry_time en ISO 8601, p. ej. 2026-11-10T12:00:00Z.
  trading_enabled:
    name: Operar desde Telegram
    description: Permite comprar y vender desde los avisos de Telegram, siempre con confirmación. Desactivado, solo hay avisos.
  okx_demo:
    name: Modo demo de OKX
    description: Opera con dinero ficticio (Demo trading). Necesita claves API creadas en modo demo. Desactívalo solo para operar con dinero real.
  okx_api_key:
    name: OKX API key
    description: Clave con permiso solo de Trade (nunca Withdraw), vinculada a la IP de tu casa.
  okx_api_secret:
    name: OKX secret key
  okx_passphrase:
    name: OKX passphrase
  max_order_amount:
    name: Importe máximo por orden
    description: En la moneda de cotización. Las compras por encima se rechazan.
  stop_loss_on_exchange:
    name: Stop en OKX
    description: Tras cada compra deja en OKX un stop-loss al nivel de la señal (2×ATR), que protege aunque Home Assistant esté caído.
  log_level:
    name: Nivel de log
  mqtt_host:
    name: Servidor MQTT
    description: Déjalo vacío para usar el broker de la app Mosquitto.
  mqtt_port:
    name: Puerto MQTT
  mqtt_username:
    name: Usuario MQTT
  mqtt_password:
    name: Contraseña MQTT
