configuration:
  quote_currency:
    name: Quote currency
    description: Currency the pairs are quoted in (e.g. SOL-USDC). BTC in this currency is the market benchmark.
  bar:
    name: Candle timeframe
    description: Length of each candle. Pairs are analysed when each one closes (UTC) and the validation is computed separately per timeframe.
  pairs:
    name: Pairs
    description: Fixed list of pairs (e.g. BTC-USDC). Empty = most liquid OKX pairs in the quote currency.
  max_pairs:
    name: Max pairs
  min_volume_24h_usdt:
    name: Min 24h volume (USD equivalent)
  enter_threshold:
    name: Entry threshold
  wait_threshold:
    name: Watch threshold
  require_validation:
    name: Require validation
    description: ENTER only alerts when the strategy was profitable out of sample after costs.
  capital:
    name: Simulated capital
  risk_per_trade_pct:
    name: Risk per trade (%)
  max_positions:
    name: Max concurrent positions
  fee_pct:
    name: Fee (%)
  slippage_pct:
    name: Slippage (%)
  positions:
    name: Open positions
    description: Used to signal EXIT. entry_time in ISO 8601.
  trading_enabled:
    name: Trade from Telegram
    description: Allow buying and selling from the Telegram notices, always after confirmation. Off = notices only.
  okx_demo:
    name: OKX demo mode
    description: Trade with simulated funds (Demo trading). Needs API keys created in demo mode. Turn off only to trade real money.
  okx_api_key:
    name: OKX API key
    description: Key with Trade permission only (never Withdraw), bound to your home IP.
  okx_api_secret:
    name: OKX secret key
  okx_passphrase:
    name: OKX passphrase
  max_order_amount:
    name: Max amount per order
    description: In the quote currency. Larger buys are rejected.
  stop_loss_on_exchange:
    name: Stop on OKX
    description: After each buy, leave a stop-loss on OKX at the signal level (2×ATR) that protects even if Home Assistant is down.
  log_level:
    name: Log level
  mqtt_host:
    name: MQTT host
    description: Leave empty to use the Mosquitto app broker.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT user
  mqtt_password:
    name: MQTT password
