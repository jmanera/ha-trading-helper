name: HA Trading Helper
version: "0.5.0"
slug: ha_trading_helper
description: Señales cripto explicables de OKX (spot, velas de 1 h a 1 día). Opcional, compra y venta confirmadas por Telegram.
url: https://github.com/jmanera/ha-trading-helper
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - mqtt:need
options:
  quote_currency: USDC
  bar: 4H
  pairs: []
  max_pairs: 20
  min_volume_24h_usdt: 5000000
  enter_threshold: 70
  wait_threshold: 40
  require_validation: true
  capital: 10000
  risk_per_trade_pct: 1.0
  max_positions: 3
  fee_pct: 0.1
  slippage_pct: 0.05
  positions: []
  trading_enabled: false
  okx_demo: true
  max_order_amount: 500
  stop_loss_on_exchange: true
  log_level: INFO
schema:
  quote_currency: list(USDC|USDT|EUR)
  bar: list(1H|2H|4H|6H|12H|1D)
  pairs:
    - match(^[A-Z0-9]+-(USDT|EUR|USDC)$)
  max_pairs: int(1,50)
  min_volume_24h_usdt: float(0,)
  enter_threshold: int(1,100)
  wait_threshold: int(0,100)
  require_validation: bool
  capital: float(0,)
  risk_per_trade_pct: float(0.1,5)
  max_positions: int(1,20)
  fee_pct: float(0,1)
  slippage_pct: float(0,1)
  positions:
    - pair: match(^[A-Z0-9]+-(USDT|EUR|USDC)$)
      entry_price: float(0,)
      entry_time: str
  trading_enabled: bool
  okx_demo: bool
  okx_api_key: str?
  okx_api_secret: password?
  okx_passphrase: password?
  max_order_amount: float(1,)
  stop_loss_on_exchange: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?  # pragma: allowlist secret
