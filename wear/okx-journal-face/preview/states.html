<!doctype html>
<!-- README image: the face in its three colours. Same layout as preview.html, in a bezel.
     Render: google-chrome --headless=new --window-size=1500,560 --screenshot=docs/img/watch-face.png preview/states.html -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #fff; font-family: "Roboto", "Noto Sans", sans-serif; }
  .row { display: flex; gap: 40px; justify-content: center; padding: 30px 20px; }
  .watch { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .bezel { width: 450px; height: 450px; border-radius: 50%; padding: 14px; background: #2c2c2a; }
  .face { position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: #000; }
  .t { position: absolute; text-align: center; white-space: nowrap; }
  .cap { color: #5f5e5a; font-size: 22px; }
</style></head><body><div class="row" id="row"></div>
<script>
  const states = [["3.690,58", "+28,28", "#3ccf91", "Día en positivo"],
                  ["3.633,92", "-28,38", "#ff6b5e", "Día en negativo"],
                  ["3.662,30", "0,00", "#ffffff", "Sin cambios"]];
  for (const [value, today, color, caption] of states) {
    document.getElementById("row").insertAdjacentHTML("beforeend", `
    <div class="watch"><div class="bezel"><div class="face">
      <div class="t" style="left:125px;top:42px;width:200px;height:56px;font-size:46px;line-height:56px;color:#e6e9ef">10:08</div>
      <div class="t" style="left:125px;top:112px;width:200px;height:34px;font-size:24px;line-height:34px;color:#888780">USDC</div>
      <div class="t" style="left:105px;top:372px;width:240px;height:32px;font-size:24px;line-height:32px;color:#888780">jue 19 nov</div>
      <div class="t" style="left:30px;top:148px;width:390px;height:100px;font-size:74px;line-height:100px;font-weight:500;color:#fff">${value}</div>
      <div style="position:absolute;left:95px;top:262px;width:260px;height:2px;background:#2c2c2a"></div>
      <div class="t" style="left:58px;top:276px;width:160px;height:60px;font-size:40px;line-height:60px;font-weight:500;color:${color}">${today}</div>
      <div class="t" style="left:232px;top:276px;width:160px;height:60px;font-size:40px;line-height:60px;font-weight:500;color:#fff">5</div>
      <div class="t" style="left:58px;top:336px;width:160px;height:30px;font-size:22px;line-height:30px;color:#888780">hoy</div>
      <div class="t" style="left:232px;top:336px;width:160px;height:30px;font-size:22px;line-height:30px;color:#888780">posiciones</div>
    </div></div><div class="cap">${caption}</div></div>`);
  }
</script></body></html>
